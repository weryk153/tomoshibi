<!doctype html>
<!-- Chakra resolves its `_dark` conditions from this class. Every surface in
     the app is painted dark by hand, so without it the system stays in light
     mode and any component that does not override its own colours renders
     near-black text on a near-black background (the drawer footer button, the
     dialogs, the number inputs). The app has no light theme and nothing reads
     the colour mode, so it is pinned here rather than toggled. -->
<html class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <!-- 沒有這行，手機瀏覽器會照 980px 寬的電腦版排版再整頁縮小：版面判斷不到
         窄螢幕，字也小到看不清。maximum-scale=1：雙指縮放是拿來縮放角色的
         （services/pinch-zoom.ts），不要變成整頁放大。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Tomoshibi</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script type="module" crossorigin src="./assets/main-HEoaUFdN.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-Bwtgi3Sd.css">
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
