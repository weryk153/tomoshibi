appId: com.tomoshibi.app
productName: Tomoshibi
directories:
  buildResources: resources
  output: release/${version}
files:
  - 'dist/**/*'
  - 'out/**/*'
  - 'resources/**/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: Tomoshibi
  icon: resources/icon.ico
  extraResources: &bundledBackend
    # Python 後端與啟動它用的 uv，由 build:mac／build:win 先跑
    # scripts/fetch-uv.mjs 與 scripts/stage-backend.mjs 備好。放 extraResources
    # 而不是 files：files 會進 asar，而 uv 和 Python 讀不了 asar 裡的檔案。
    # uv 依架構分開放，${os}-${arch} 讓 x64 與 arm64 的 dmg 各拿到自己那份。
    - from: bundled/backend
      to: backend
    - from: bundled/uv/${os}-${arch}
      to: uv
      filter: ['uv', 'uv.exe']
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  differentialPackage: false
mac:
  icon: resources/icon.icns
  extraResources: *bundledBackend
  target:
    - target: dmg
      arch: [x64, arm64]
  # resources/ 而不是預設的 build/：build 在 .gitignore 裡（第 19 行），
  # 放那邊的話這個檔進不了版控，簽章時就會找不到。
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  # 一定要帶 ${arch}：mac target 同時建 x64 與 arm64，檔名不分架構的話兩者會寫到
  # 同一個檔案互相覆蓋，electron-builder 會反覆「retrying 5 more times」，
  # 最後只留下一個（誰後建誰贏），而且沒有任何地方說得出它是哪個架構。
  artifactName: ${name}-${version}-${arch}.${ext}
  writeUpdateInfo: false
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Kuren Peng <weryk153@users.noreply.github.com>
  category: Utility
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: weryk153
  repo: tomoshibi
  # draft，不是 release：打包時就算帶了 --publish，也只會產生草稿，
  # 要不要公開由人按下去決定。目前還沒有任何打包發行版。
  releaseType: draft
  publishAutoUpdate: false