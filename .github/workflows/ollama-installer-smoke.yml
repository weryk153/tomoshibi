# 精靈的「一鍵安裝 Ollama」在乾淨機器上實際跑一次。
#
# 單元測試把網路和安裝程式都假造掉了，驗不到真正會出錯的地方：官方安裝檔的檔名與
# 校驗碼格式有沒有改、Windows 的靜默安裝參數還管不管用、裝完 Ollama 會不會真的
# 在 11434 回應。開發機上已經裝了 Ollama，也沒辦法拿來試。
#
# 會下載官方安裝檔（Windows 約 1.5GB），所以只在手動觸發、或動到安裝器時跑。

name: Ollama one-click install

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/open_llm_vtuber/ollama_installer.py'
      - '.github/workflows/ollama-installer-smoke.yml'

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Ollama is not installed yet
        shell: bash
        run: |
          if curl -sf -m 3 http://127.0.0.1:11434/api/version; then
            echo "runner 上已經有 Ollama 在跑，這樣測不出安裝流程" >&2
            exit 1
          fi

      - name: Install Ollama the way the wizard does
        env:
          PYTHONUTF8: '1'
        run: uv run --frozen python -m src.open_llm_vtuber.ollama_installer

      - name: Ollama answers on 11434
        shell: bash
        run: curl -sf http://127.0.0.1:11434/api/version

      # 使用者在 Windows 上實際遇到：安裝程式開的 Ollama 還沒起來，我們又開了一個，
      # 兩個 app 打架（Failed to fetch settings）。裝完只能有一個 app 本體在跑。
      - name: Only one Ollama app is running
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            n=$(powershell -NoProfile -Command '@(Get-Process -Name "ollama app" -ErrorAction SilentlyContinue).Count')
          else
            n=$(pgrep -f "Ollama.app/Contents/MacOS/Ollama" | wc -l | tr -d ' ')
          fi
          echo "Ollama app processes: $n"
          [ "$n" -le 1 ]

      # 失敗時看得出卡在哪：app 有沒有在跑、伺服器有沒有被帶起來、log 說了什麼。
      - name: Show Ollama processes and logs
        if: failure()
        shell: bash
        run: |
          ps aux | grep -i '[o]llama' || true
          LAD=$(cygpath -u "${LOCALAPPDATA:-}" 2>/dev/null || echo "${LOCALAPPDATA:-}")
          for f in "$HOME"/.ollama/logs/*.log "$LAD"/Ollama/*.log; do
            [ -f "$f" ] && { echo "===== $f"; tail -60 "$f"; }
          done
          true
